name: Verificar prototipo

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build -- --base=/TheFragrancerBar/
        env:
          SITE_URL: https://josemarrero3012.github.io/TheFragrancerBar
      - run: npm run check:dist -- /TheFragrancerBar/
        env:
          SITE_URL: https://josemarrero3012.github.io/TheFragrancerBar
